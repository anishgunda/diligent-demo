[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "identitytwin-api"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3", "psycopg[binary,pool]>=3.2,<4",
  "clerk-backend-api>=6,<7", "httpx>=0.28,<1",
  "langgraph>=1,<2", "openai>=2,<3", "pypdf>=6,<7",
  "python-multipart>=0.0.22,<1", "dnspython>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "cryptography>=45,<50", "PyJWT>=2.10,<3", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a disposable PostgreSQL database", "paid: sends an explicit request to xAI"]

[tool.ruff]
target-version = "py311"
line-length = 112

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
